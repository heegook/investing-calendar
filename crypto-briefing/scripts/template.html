<title>업비트 코인 주간 브리핑</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: 1080px 단일 칼럼 리서치 노트, 상단 네이비 표지 밴드 + 스티키 툴바, 섹션은 번호 ①~⑥ 순서 */
:root{
  --bg:#ffffff; --surface:#f5f7fb; --surface-2:#eaeef6; --line:#d8dee9; --line-strong:#9aa6ba;
  --ink:#121a2b; --ink-2:#3a4459; --muted:#647089;
  --navy:#13294b; --navy-2:#1f3b68; --on-navy:#ffffff; --on-navy-2:#c9d4e8;
  --up:#c62828; --up-bg:#fdecec; --down:#1d5fbf; --down-bg:#e8f0fc;
  --fact:#1d6b47; --fact-bg:#e6f4ec; --media:#7a5a00; --media-bg:#fbf3dc; --view:#5a3d99; --view-bg:#efe9fb; --warn:#9a3412; --warn-bg:#fdeee4;
  --link:#1f4f9a; --strong:#13294b; --c-btc:#c77700; --c-eth:#4f55c5; --c-xrp:#0e8587; --c-doge:#b03f73;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1422; --surface:#141d2f; --surface-2:#1b263b; --line:#2a3650; --line-strong:#4a5a7a;
  --ink:#e8edf6; --ink-2:#c3cbdb; --muted:#8f9bb3;
  --navy:#0a1730; --navy-2:#1a2f55; --on-navy:#f2f5fb; --on-navy-2:#aab8d3;
  --up:#ff6b6b; --up-bg:#3a1a1e; --down:#6aa5ff; --down-bg:#14264a;
  --fact:#5fd39a; --fact-bg:#12301f; --media:#e7c15a; --media-bg:#33290d; --view:#b79cff; --view-bg:#271d42; --warn:#ffa177; --warn-bg:#3a2014;
  --link:#9cc0ff; --strong:#3d68b5; --c-btc:#f0a63a; --c-eth:#8f95ff; --c-xrp:#3cc6c8; --c-doge:#ee7fb0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1422; --surface:#141d2f; --surface-2:#1b263b; --line:#2a3650; --line-strong:#4a5a7a;
  --ink:#e8edf6; --ink-2:#c3cbdb; --muted:#8f9bb3;
  --navy:#0a1730; --navy-2:#1a2f55; --on-navy:#f2f5fb; --on-navy-2:#aab8d3;
  --up:#ff6b6b; --up-bg:#3a1a1e; --down:#6aa5ff; --down-bg:#14264a;
  --fact:#5fd39a; --fact-bg:#12301f; --media:#e7c15a; --media-bg:#33290d; --view:#b79cff; --view-bg:#271d42; --warn:#ffa177; --warn-bg:#3a2014;
  --link:#9cc0ff; --strong:#3d68b5; --c-btc:#f0a63a; --c-eth:#8f95ff; --c-xrp:#3cc6c8; --c-doge:#ee7fb0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.7;margin:0;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
a{color:var(--link);text-underline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{text-wrap:balance;line-height:1.35;margin:0}
p{margin:0}

/* 표지 */
.cover{background:var(--navy);color:var(--on-navy)}
.cover .wrap{padding-block:40px 32px;display:grid;gap:20px}
.eyebrow{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-navy-2);font-weight:600}
.cover h1{font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.01em}
.cover .sub{color:var(--on-navy-2);font-size:15px;max-width:60ch}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.18);border-radius:8px;overflow:hidden}
.meta div{background:var(--navy);padding:12px 14px;display:grid;gap:2px}
.meta dt{font-size:12px;color:var(--on-navy-2);letter-spacing:.04em}
.meta dd{margin:0;font-weight:700;font-size:14.5px}
.snapshot-flag{display:inline-flex;gap:8px;align-items:center;font-size:13px;color:var(--on-navy);border:1px solid rgba(255,255,255,.35);padding:4px 10px;border-radius:999px;width:max-content;max-width:100%}
.snapshot-flag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--on-navy-2)}

/* 툴바 */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.toolbar .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-block:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.btn{font:inherit;font-size:13.5px;font-weight:600;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer;line-height:1.3}
.btn:hover{background:var(--surface)}
.btn:focus-visible,.fold-btn:focus-visible,a:focus-visible{outline:2px solid var(--navy-2);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--strong);border-color:var(--strong);color:#fff}
.btn.primary{background:var(--strong);color:#fff;border-color:var(--strong)}
.tool-note{font-size:12.5px;color:var(--muted);width:100%}
.tool-note[data-empty="1"]{display:none}

/* 섹션 */
main .wrap{display:grid;gap:56px;padding-block:36px 64px}
section.block{display:grid;gap:20px;min-width:0}
.sec-head{display:grid;gap:6px;border-bottom:2px solid var(--strong);padding-bottom:10px}
.sec-head .no{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.sec-head h2{font-size:clamp(20px,2.6vw,25px);font-weight:800;color:var(--ink)}
.sec-head p{color:var(--muted);font-size:14px}
h3{font-size:18px;font-weight:750}
h4{font-size:15px;font-weight:750;color:var(--ink-2)}
.lead{font-size:16.5px;color:var(--ink-2);max-width:72ch}
.prose{display:grid;gap:12px;max-width:76ch}
.small{font-size:13px;color:var(--muted)}

/* 태그 */
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:4px;margin-right:6px;vertical-align:1px;white-space:nowrap}
.t-fact{color:var(--fact);background:var(--fact-bg)}
.t-media{color:var(--media);background:var(--media-bg)}
.t-view{color:var(--view);background:var(--view-bg)}
.t-warn{color:var(--warn);background:var(--warn-bg)}
.legend-tags{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);align-items:center}

/* 핵심 3가지 */
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.key{border:1px solid var(--line);border-top:3px solid var(--strong);border-radius:6px;padding:16px 18px;display:grid;gap:8px;align-content:start;background:var(--bg)}
.key .k-no{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.key h3{font-size:16.5px}
.key p{font-size:14.5px;color:var(--ink-2)}
.analysis{background:var(--surface);border-radius:8px;padding:20px 22px;display:grid;gap:10px}

/* 가격 카드 */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.cards{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:10px;background:var(--bg);min-width:0}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sym{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
.sym i{width:10px;height:10px;border-radius:2px;display:inline-block}
.mk{font-size:12px;color:var(--muted)}
.price{font-size:22px;font-weight:800;letter-spacing:-.01em}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;color:var(--ink-2);border-top:1px dashed var(--line);padding-top:6px}
.row span:first-child{color:var(--muted)}
.chg{display:inline-flex;gap:6px;align-items:center;font-weight:800;padding:3px 9px;border-radius:5px;font-size:15px;width:max-content}
.chg.up{color:var(--up);background:var(--up-bg)}
.chg.down{color:var(--down);background:var(--down-bg)}
.chg small{font-weight:600;font-size:12px}
.vs{font-size:12px;color:var(--muted)}

/* 차트 */
.charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px}
@media (max-width:900px){.charts{grid-template-columns:minmax(0,1fr)}}
figure{margin:0;border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:10px;min-width:0;background:var(--bg)}
figcaption{font-weight:750;font-size:15px}
figure .note{font-size:12.5px;color:var(--muted)}
.chart-box{overflow-x:auto}
.chart-box svg{display:block;width:100%;height:auto;min-width:300px}
svg text{font-family:var(--font)}
.ax{stroke:var(--line);stroke-width:1}
.ax0{stroke:var(--line-strong);stroke-width:1.2}
.tick{fill:var(--muted);font-size:11px}
.lab{fill:var(--ink);font-size:12px;font-weight:700}
.val{font-size:12px;font-weight:800}
.val.down{fill:var(--down)} .val.up{fill:var(--up)}
.bar-down{fill:var(--down)} .bar-up{fill:var(--up)}
.s-btc{stroke:var(--c-btc)} .f-btc{fill:var(--c-btc)}
.s-eth{stroke:var(--c-eth)} .f-eth{fill:var(--c-eth)}
.s-xrp{stroke:var(--c-xrp)} .f-xrp{fill:var(--c-xrp)}
.s-doge{stroke:var(--c-doge)} .f-doge{fill:var(--c-doge)}
.line{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.dot{stroke:var(--bg);stroke-width:1.5}
.bg-rect{fill:var(--bg)}

/* 표 */
.tbl-wrap{overflow-x:auto;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
th,td{padding:9px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
thead th{background:var(--surface-2);font-weight:700;color:var(--ink);white-space:nowrap}
td.r,th.r{text-align:right}
td .up{color:var(--up);font-weight:700} td .down{color:var(--down);font-weight:700}
.na{color:var(--muted);font-style:normal;font-weight:600}

/* 코인 상세 */
.coin-panel{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.coin-head{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;align-items:center;padding:16px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.coin-head h3{display:flex;gap:10px;align-items:center;font-size:19px}
.coin-head h3 i{width:12px;height:12px;border-radius:3px;display:inline-block}
.coin-body{padding:8px 20px 18px;display:grid}
.fold{border-bottom:1px solid var(--line)}
.fold:last-child{border-bottom:none}
.fold-btn{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 2px;font-weight:750;font-size:15px;color:var(--ink)}
.fold-btn::after{content:"＋";font-weight:400;color:var(--muted);font-size:18px;line-height:1}
.fold:not(.collapsed) > .fold-btn::after{content:"－"}
.fold-body{padding:0 2px 16px;display:grid;gap:10px;min-width:0}
.fold.collapsed > .fold-body{display:none}
ul.pts{margin:0;padding-left:1.15em;display:grid;gap:7px}
ul.pts li::marker{color:var(--muted)}
.argue{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.argue{grid-template-columns:1fr}}
.arg{border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:grid;gap:6px;align-content:start}
.arg .hd{font-weight:800;font-size:14px}
.arg .hd.up{color:var(--up)} .arg .hd.down{color:var(--down)}
.arg .counter{border-top:1px dashed var(--line);padding-top:6px;font-size:14px;color:var(--ink-2)}
.arg .counter b{color:var(--muted);font-size:12.5px;margin-right:4px}
.is-filtered, .sig-list li.is-filtered{display:none}
body[data-focus] .cc{opacity:.22;transition:opacity .15s}
body[data-focus="BTC"] .c-BTC, body[data-focus="ETH"] .c-ETH, body[data-focus="XRP"] .c-XRP, body[data-focus="DOGE"] .c-DOGE{opacity:1}
td.c-on, th.c-on{background:transparent}
.filter-note{font-size:12.5px;font-weight:600;color:var(--strong);width:100%}
.filter-note[data-empty="1"]{display:none}

/* 뉴스 목록 */
.news{display:grid;gap:0;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.news-item{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:6px 20px;padding:12px 4px;border-bottom:1px solid var(--line)}
.news-item:last-child{border-bottom:none}
@media (max-width:760px){.news-item{grid-template-columns:minmax(0,1fr)}}
.news-item .what{font-size:14.5px}
.news-item .src{font-size:12.5px;color:var(--muted);display:grid;gap:2px}
.news-item .src a{font-weight:600}

/* 시나리오 */
.scen{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.sc{border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:8px;align-content:start}
.sc h4{color:var(--ink)}
.sc dl{margin:0;display:grid;gap:6px;font-size:14px}
.sc dt{font-weight:700;font-size:12.5px;color:var(--muted)}
.sc dd{margin:0}


/* 기간별 전망 */
.hz{border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:grid;gap:16px;background:var(--bg);min-width:0}
.hz-head{display:flex;gap:14px;align-items:flex-start}
.hz-chip{flex:none;font-size:13px;font-weight:800;color:#fff;background:var(--strong);padding:4px 12px;border-radius:5px;letter-spacing:.04em}
.hz-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:800px){.hz-grid{grid-template-columns:minmax(0,1fr)}}
.sig-list{list-style:none;margin:0;padding:0;display:grid;gap:9px;font-size:14.5px}
.sig-list li{display:block;line-height:1.65}
.sig-list b{margin-right:6px}
.sig{display:inline-block;margin-right:8px;vertical-align:1px;font-size:11.5px;font-weight:800;padding:1px 8px;border-radius:4px;border:1px solid currentColor}
.sig.down{color:var(--down)} .sig.up{color:var(--up)} .sig.mixed{color:var(--muted)}

/* 회차 이동 · 보관함 · 달력 */
.ed-nav{display:flex;flex-wrap:wrap;gap:8px}
.ed-btn{font-size:13px;font-weight:700;color:var(--on-navy);border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:6px;text-decoration:none}
a.ed-btn:hover{background:rgba(255,255,255,.12)}
.ed-btn.off{opacity:.4}
.ed-banner{background:var(--warn-bg);color:var(--warn);font-weight:700;font-size:14px;padding:9px 14px;border-radius:6px}
.ed-banner a{color:inherit}
.arch{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.arch{grid-template-columns:minmax(0,1fr)}}
.cal{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;background:var(--bg);min-width:0}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-head h3{font-size:17px}
.cal-nav{font-size:18px;line-height:1;padding:4px 12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dow{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0}
.cal-dow.sun{color:var(--up)} .cal-dow.sat{color:var(--down)}
.cal-cell{all:unset;box-sizing:border-box;min-height:74px;border:1px solid var(--line);border-radius:6px;padding:4px 5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;background:var(--bg);min-width:0;overflow:hidden}
.cal-cell:hover{border-color:var(--line-strong)}
.cal-cell:focus-visible{outline:2px solid var(--strong);outline-offset:1px}
.cal-cell.out{opacity:.35}
.cal-cell.sel{border:2px solid var(--strong);padding:3px 4px}
.cal-cell.today .cal-d{background:var(--strong);color:#fff;border-radius:999px;padding:0 6px}
.cal-cell.read{background:var(--surface)}
.cal-d{font-size:12.5px;font-weight:700;width:max-content}
.cal-ed{font-size:11px;font-weight:800;color:#fff;background:var(--strong);border-radius:4px;padding:1px 5px;width:max-content;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-ed.cur{outline:2px solid var(--warn);outline-offset:1px}
.cal-ret{font-size:11px;font-weight:700}
.cal-ev{font-size:10.5px;line-height:1.3;color:var(--ink-2);border-left:2px solid var(--warn);padding-left:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cal-rd{font-size:10.5px;color:var(--muted)}
@media (max-width:560px){
  .cal{padding:10px}
  .cal-cell{min-height:52px;padding:3px}
  .cal-ev,.cal-ret,.cal-rd{display:none}
  .cal-ed{font-size:10px;padding:0 3px}
  .cal-cell.has-ev::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn);margin-top:auto}
}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.cal-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.lg-ed{background:var(--strong)} .lg-read{background:var(--surface);border:1px solid var(--line-strong)} .lg-ev{background:var(--warn)} .lg-today{background:var(--strong);border-radius:50%!important}
.cal-side{display:grid;gap:12px;min-width:0}
.cal-detail{border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px;background:var(--bg)}
.cal-detail h4{font-size:16px;color:var(--ink)}
.cal-detail ul{margin:0;padding-left:1.1em;display:grid;gap:6px;font-size:14px}
.cal-detail .open-ed{display:inline-block;width:max-content;background:var(--strong);color:#fff;font-weight:700;font-size:14px;padding:7px 14px;border-radius:6px;text-decoration:none}
.cal-detail .rets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;font-size:13px}
.cal-detail .rets div{border:1px solid var(--line);border-radius:6px;padding:6px;text-align:center}
.cur-row td{background:var(--surface)}
.cal-ret.up,.rets .up{color:var(--up)} .cal-ret.down,.rets .down{color:var(--down)}
section.block{scroll-margin-top:96px}
.new-chip{font-size:11px;font-weight:800;color:var(--up);border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-left:4px}
/* 출처 */
.src-list{display:grid;gap:4px;margin:0;padding-left:1.4em;font-size:13.5px}
.src-list li{padding:3px 0}
.src-list .dom{color:var(--muted);font-size:12px}
.callout{border-left:3px solid var(--warn);background:var(--warn-bg);padding:12px 16px;border-radius:0 6px 6px 0;font-size:14px;display:grid;gap:6px}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.howto ol{margin:0;padding-left:1.3em;display:grid;gap:6px;font-size:14px}
code{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
footer .wrap{padding-block:20px 32px;display:grid;gap:6px}

@media (prefers-reduced-motion:no-preference){.btn,.fold-btn::after{transition:background .15s,color .15s}}

/* 인쇄: A4 세로, 숨김 탭·접힌 내용 모두 출력 */
@page{size:A4;margin:14mm 12mm 16mm}
@media print{
  :root{--bg:#fff;--surface:#f4f6fa;--surface-2:#e9edf4;--ink:#000;--ink-2:#222;--muted:#555;--line:#c9d0dc}
  body{font-size:10.5pt;line-height:1.55;background:#fff;color:#000}
  body::before{display:none}
  .toolbar{display:none!important}
  .cover{background:#fff!important;color:#000!important;border-bottom:2.5pt solid #13294b}
  .cover .wrap{padding-block:0 12px}
  .cover .eyebrow,.cover .sub{color:#333!important}
  .meta{background:#c9d0dc;border-color:#c9d0dc}
  .meta div{background:#fff!important}
  .meta dt{color:#555!important} .meta dd{color:#000}
  .snapshot-flag{color:#000;border-color:#999}
  .wrap{max-width:none;padding-left:0;padding-right:0}
  main .wrap{gap:22px;padding-block:14px 0}
  .is-filtered{display:block!important}
  .sig-list li.is-filtered{display:block!important}
  .cc{opacity:1!important}
  .filter-note{display:none!important}
  .ed-nav,.cal,.cal-side{display:none!important}
  .arch{display:block}
  .ed-btn{color:#000}
  .fold.collapsed > .fold-body{display:grid!important}
  .fold-btn::after{display:none}
  .cards{grid-template-columns:repeat(2,1fr)}
  .keys{grid-template-columns:repeat(3,1fr)}
  .meta{grid-template-columns:repeat(2,1fr)}
  .charts{grid-template-columns:1fr 1fr}
  .card,.key,figure,.sc,.arg,.news-item,tr,.fold-btn{break-inside:avoid}
  .sec-head{break-after:avoid}
  section.block{break-inside:auto}
  #sec-detail,#sec-outlook,#sec-sources{break-before:page}
  .hz{break-inside:auto}
  .hz-grid{grid-template-columns:1fr 1fr}
  .hz-head,.sig-list li{break-inside:avoid}
  .coin-panel{margin-bottom:10px}
  .coin-head{break-after:avoid}
  .tbl-wrap,.chart-box{overflow:visible}
  table{min-width:0;font-size:9.5pt}
  .chart-box svg{min-width:0}
  a{color:#000;text-decoration:underline}
  footer{font-size:9pt}
}
</style>

{{BODY}}

<script>
(function(){
  var coinBtns = document.querySelectorAll('[data-filter]');
  var fnote = document.getElementById('filter-note');
  // ⑤ 신호 판단 목록의 각 줄에 코인 표시를 붙임 (굵은 글씨의 코인명 기준)
  document.querySelectorAll('.sig-list li').forEach(function(li){
    var b = li.querySelector('b'); if (b) li.setAttribute('data-coin', b.textContent.trim());
  });
  var panels = document.querySelectorAll('[data-coin]');
  function setFilter(c, fromClick){
    coinBtns.forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-filter')===c ? 'true':'false'); });
    panels.forEach(function(p){
      var list = p.getAttribute('data-coin').split(' ');
      p.classList.toggle('is-filtered', c!=='ALL' && list.indexOf(c)===-1 && list.indexOf('ALL')===-1);
    });
    if (c === 'ALL') document.body.removeAttribute('data-focus'); else document.body.setAttribute('data-focus', c);
    if (fnote){
      fnote.textContent = c === 'ALL' ? '' : c + ' 선택 중 · ② 가격 카드, ③ 코인별 상세, ⑤ 신호 판단은 ' + c + '만 표시하고 차트·표는 ' + c + '를 강조함 (① 요약·④ 공통 요인은 전체 공통 내용이라 그대로임)';
      fnote.setAttribute('data-empty', c === 'ALL' ? '1' : '0');
    }
    if (fromClick && c !== 'ALL'){
      var target = document.getElementById('sec-price');
      if (target && target.getBoundingClientRect().top > 160){
        var bar = document.querySelector('.toolbar');
        var y = target.getBoundingClientRect().top + window.pageYOffset - (bar ? bar.offsetHeight + 12 : 70);
        var smooth = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
        window.scrollTo({ top: y, behavior: smooth ? 'smooth' : 'auto' });
      }
    }
  }
  coinBtns.forEach(function(b){ b.addEventListener('click', function(){ setFilter(b.getAttribute('data-filter'), true); }); });
  setFilter('ALL', false);

  document.querySelectorAll('.fold').forEach(function(f){
    var b = f.querySelector('.fold-btn');
    b.setAttribute('aria-expanded', f.classList.contains('collapsed') ? 'false':'true');
    b.addEventListener('click', function(){
      var c = f.classList.toggle('collapsed');
      b.setAttribute('aria-expanded', c ? 'false':'true');
    });
  });
  function all(open){
    document.querySelectorAll('.fold').forEach(function(f){
      f.classList.toggle('collapsed', !open);
      f.querySelector('.fold-btn').setAttribute('aria-expanded', open?'true':'false');
    });
  }
  document.getElementById('btn-open').addEventListener('click', function(){ all(true); });
  document.getElementById('btn-close').addEventListener('click', function(){ all(false); });


  // 보관함·달력
  (function(){
    var el = document.getElementById('archive-data'); if (!el) return;
    var D; try { D = JSON.parse(el.textContent); } catch(e){ return; }
    var grid = document.getElementById('cal-grid'), title = document.getElementById('cal-title'), detail = document.getElementById('cal-detail');
    function href(f){ return f; }   // 링크 경로는 빌드 단계에서 화면 위치(최신본/보관본)에 맞게 정해짐
    var eds = {}; D.editions.forEach(function(x){ eds[x.date] = x; });
    var evs = {}; D.events.forEach(function(x){ (evs[x.date] = evs[x.date] || []).push(x); });
    function iso(d){ return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); }
    var kst = new Date(Date.now() + (9*60 + new Date().getTimezoneOffset())*60000), todayIso = iso(kst);
    var cur = D.current.split('-'), view = new Date(+cur[0], +cur[1]-1, 1), selIso = D.current;
    var all = Object.keys(eds).concat(Object.keys(evs)).sort();
    var minM = new Date(+all[0].slice(0,4), +all[0].slice(5,7)-1, 1), maxM = new Date(+all[all.length-1].slice(0,4), +all[all.length-1].slice(5,7)-1, 1);
    if (kst > maxM) maxM = new Date(kst.getFullYear(), kst.getMonth(), 1);
    var W = '일월화수목금토';
    function fmtPct(v){ if (v === null || v === undefined) return '미보고'; return (v>0?'▲ +':v<0?'▼ −':'± ') + Math.abs(v).toFixed(2) + '%'; }
    function cls(v){ return v>0 ? 'up' : v<0 ? 'down' : ''; }
    function render(){
      title.textContent = view.getFullYear() + '년 ' + (view.getMonth()+1) + '월';
      document.getElementById('cal-prev').disabled = view <= minM;
      document.getElementById('cal-next').disabled = view >= maxM;
      var h = '';
      for (var i=0;i<7;i++) h += '<div class="cal-dow' + (i===0?' sun':i===6?' sat':'') + '">' + W[i] + '</div>';
      var start = new Date(view.getFullYear(), view.getMonth(), 1 - view.getDay());
      for (var k=0;k<42;k++){
        var d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+k), s = iso(d);
        if (k >= 35 && d.getMonth() !== view.getMonth()) break;
        var ed = eds[s], ev = evs[s] || [], read = D.reading.weekdays.indexOf(d.getDay()) !== -1;
        var c = 'cal-cell' + (d.getMonth()!==view.getMonth()?' out':'') + (s===todayIso?' today':'') + (s===selIso?' sel':'') + (read?' read':'') + (ev.length?' has-ev':'');
        var lab = d.getMonth()+1 + '월 ' + d.getDate() + '일' + (ed?', 브리핑 회차':'') + (read?', 정기 열람일':'') + (ev.length?', 일정 ' + ev.length + '건':'');
        h += '<button type="button" class="' + c + '" data-d="' + s + '" aria-label="' + lab + '"><span class="cal-d">' + d.getDate() + '</span>';
        if (ed) h += '<span class="cal-ed' + (s===D.current?' cur':'') + '">' + (s===D.current?'현재':'회차') + '</span><span class="cal-ret ' + cls(ed.ret.BTC) + '">BTC ' + fmtPct(ed.ret.BTC).replace('▲ ','').replace('▼ ','') + '</span>';
        else if (read) h += '<span class="cal-rd">열람 07:00</span>';
        ev.slice(0,2).forEach(function(e){ h += '<span class="cal-ev">' + e.label + '</span>'; });
        h += '</button>';
      }
      grid.innerHTML = h;
    }
    function show(s){
      selIso = s; render();
      var p = s.split('-'), d = new Date(+p[0], +p[1]-1, +p[2]), ed = eds[s], ev = evs[s] || [];
      var h = '<h4>' + (+p[1]) + '월 ' + (+p[2]) + '일 (' + W[d.getDay()] + ')</h4>';
      if (ed){
        h += '<p><b>브리핑 회차</b> · 분석 기간 ' + ed.period + ' · 발행 ' + ed.published + '</p><div class="rets">';
        ['BTC','ETH','XRP','DOGE'].forEach(function(c){ h += '<div><b>' + c + '</b><br><span class="' + cls(ed.ret[c]) + '">' + fmtPct(ed.ret[c]) + '</span></div>'; });
        h += '</div>' + (s === D.current ? '<p class="small">지금 보고 있는 회차임</p>' : '<a class="open-ed" href="' + href(ed.file) + '">이 회차 열기 →</a>');
      }
      if (D.reading.weekdays.indexOf(d.getDay()) !== -1) h += '<p class="small">정기 열람일 (' + D.reading.time + ' KST)' + (ed ? '' : (s > D.latest ? ' · 아직 발행 전' : ' · 이 날짜 기준 회차 없음')) + '</p>';
      if (ev.length){ h += '<ul>'; ev.forEach(function(e){ h += '<li>' + (e.time ? '<b>' + e.time + '</b> ' : '') + e.label + ' <span class="small">(' + e.status + ' · ' + e.source + ')</span></li>'; }); h += '</ul>'; }
      if (!ed && !ev.length && D.reading.weekdays.indexOf(d.getDay()) === -1) h += '<p class="small">이 날짜에는 회차나 등록된 일정이 없음</p>';
      detail.innerHTML = h;
    }
    grid.addEventListener('click', function(e){ var b = e.target.closest('.cal-cell'); if (b) show(b.getAttribute('data-d')); });
    document.getElementById('cal-prev').addEventListener('click', function(){ view = new Date(view.getFullYear(), view.getMonth()-1, 1); render(); });
    document.getElementById('cal-next').addEventListener('click', function(){ view = new Date(view.getFullYear(), view.getMonth()+1, 1); render(); });
    show(D.current);
  })();
  var note = document.getElementById('print-note');
  var framed = false; try{ framed = window.self !== window.top; }catch(e){ framed = true; }
  document.getElementById('btn-print').addEventListener('click', function(){
    if (framed){
      note.textContent = '미리보기 화면 안에서는 브라우저가 인쇄 창을 막을 수 있음 → index.html 파일을 엣지·크롬에서 직접 연 뒤 이 버튼(또는 Ctrl+P)으로 인쇄·PDF 저장 바람';
      note.setAttribute('data-empty','0');
    }
    try{ window.print(); }catch(e){}
  });
})();
</script>
